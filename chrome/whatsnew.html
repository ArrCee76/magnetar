<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Magnetar 2.0</title>
  <link rel="stylesheet" href="whatsnew.css">
</head>
<body>
  <main class="whatsnew" aria-labelledby="whatsnew-title">
    <header class="whatsnew-header">
      <img class="whatsnew-logo" src="icons/icon128.png" alt="" aria-hidden="true">
      <p class="whatsnew-kicker">Magnetar 2.0</p>
      <h1 class="whatsnew-title" id="whatsnew-title">Magnetar got a serious upgrade.</h1>
    </header>

    <div class="whatsnew-copy">
      <p>Everything is still simple.</p>
      <p>There are new tools if you want them.</p>
      <p>Go use it.</p>
    </div>

    <form class="whatsnew-form" id="whatsnew-form">
      <fieldset class="choice-group">
        <legend>Interface mode</legend>
        <div class="choice-row" role="radiogroup" aria-label="Interface mode">
          <label class="choice-option">
            <input type="radio" name="interface-mode" value="standard">
            <span>Standard</span>
          </label>
          <label class="choice-option">
            <input type="radio" name="interface-mode" value="advanced">
            <span>Advanced</span>
          </label>
        </div>
      </fieldset>

      <fieldset class="choice-group">
        <legend>Toolbar style</legend>
        <div class="choice-row" role="radiogroup" aria-label="Toolbar style">
          <label class="choice-option">
            <input type="radio" name="toolbar-style" value="compact">
            <span>Compact</span>
          </label>
          <label class="choice-option">
            <input type="radio" name="toolbar-style" value="full">
            <span>Full</span>
          </label>
        </div>
      </fieldset>

      <button class="btn-go" id="whatsnew-go" type="submit">Go</button>
      <p class="whatsnew-status" id="whatsnew-status" role="status" aria-live="polite"></p>
    </form>
  </main>

  <script src="lib/browser-polyfill.min.js"></script><script src="lib/api-shim.js"></script><script src="whatsnew.js"></script>
</body>
</html>
