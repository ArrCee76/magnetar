<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">

    <!-- Header -->
    <div class="popup-header">
      <div class="popup-brand">
        <span class="popup-logo" aria-hidden="true"></span>
        <span class="popup-title" data-i18n="extensionName">Magnetar</span>
      </div>
      <div class="popup-header-buttons">
        <button class="popup-theme" id="theme-toggle" title="Toggle theme" aria-label="Toggle theme">
          <svg id="theme-icon-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
          <svg id="theme-icon-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
          </svg>
        </button>
        <button class="popup-gear" id="open-settings" data-i18n-title="popupSettingsTitle" title="Settings">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Mode -->
    <div class="popup-section">
      <div class="popup-row">
        <span class="popup-label" data-i18n="popupModeLabel2">Mode</span>
        <select class="popup-select" id="mode-select">
          <option value="local" data-i18n="modeLocalName">Local Client</option>
          <option value="realdebrid" data-i18n="modeRealDebridName">Real-Debrid</option>
          <option value="rdtclient" data-i18n="modeRdtClientName">RDT Client</option>
          <option value="torbox" data-i18n="modeTorBoxName">TorBox</option>
          <option value="premiumize" data-i18n="modePremiumizeName">Premiumize</option>
          <option value="alldebrid" data-i18n="modeAllDebridName">AllDebrid</option>
        </select>
      </div>
    </div>

    <!-- Shield -->
    <div class="popup-section">
      <div class="popup-section-title">
        <span data-i18n="popupShieldTitle">Shield</span>
        <label class="popup-toggle">
          <input type="checkbox" id="shield-toggle">
          <span class="popup-toggle-track"></span>
        </label>
      </div>
      <div class="popup-row popup-row-subtle" id="shield-info">
        <span class="shield-icon">🛡️</span>
        <span id="shield-count">0 sites blocked</span>
      </div>
      <button class="popup-link" id="manage-shield" data-i18n="popupManageBlocked">Manage blocked sites →</button>
    </div>

    <!-- This Page -->
    <div class="popup-section">
      <div class="popup-section-title" data-i18n="popupThisPage">This Page</div>
      <div class="popup-page-status" id="page-status">
        <span class="popup-status-icon" id="status-icon">—</span>
        <span class="popup-status-text" id="status-text" data-i18n="popupChecking">Checking…</span>
      </div>
    </div>

    <!-- Footer -->
    <div class="popup-footer">
      <span class="popup-version" id="popup-version">v1.0.0</span>
      <span class="popup-sep">·</span>
      <a href="https://github.com/ArrCee76/magnetar" target="_blank" class="popup-link-footer" data-i18n="footerGitHub">GitHub</a>
    </div>

  </div>

  <script src="popup.js"></script>
</body>
</html>
